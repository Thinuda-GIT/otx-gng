[package]
name = "otx-tweaks"
description = "Declarative tweak manifests and the single generic engine that checks, applies, verifies and reverts them."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
otx-protocol = { version = "0.2.0", path = "../otx-protocol" }
otx-sysinfo = { version = "0.2.0", path = "../otx-sysinfo" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
winreg = "0.56.0"

[dependencies.windows]
version = "0.61.3"
features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_Services",
  "Win32_UI_WindowsAndMessaging",
]
