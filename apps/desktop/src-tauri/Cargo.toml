[package]
name = "otx-gng"
description = "OTX.GNG — free, honest, measurable game boosting for Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

# Library + thin binary is the layout Tauri 2 recommends.
[lib]
name = "otx_gng_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
otx-monitor = { version = "0.2.0", path = "../../../crates/otx-monitor" }
otx-protocol = { version = "0.2.0", path = "../../../crates/otx-protocol" }
otx-sysinfo = { version = "0.2.0", path = "../../../crates/otx-sysinfo" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1.53.3", features = ["net", "io-util", "sync", "time"] }
tracing = "0.1.44"

[dependencies.windows]
version = "0.61.3"
features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_System_Threading"]
