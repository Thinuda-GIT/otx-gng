name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust tests (protocol, sysinfo, core incl. named-pipe IPC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked -p otx-protocol -p otx-sysinfo -p otx-core
      - name: Generated TypeScript types are up to date
        run: git diff --exit-code -- apps/desktop/src/backend/generated
      - name: Hardware detection runs on the CI machine
        run: cargo run --locked -p otx-sysinfo --example sysinfo

  ui:
    name: UI typecheck, tests, build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  shell:
    name: Desktop app compiles (with Core sidecar)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build:core:dev
      - run: npm run build
      - name: cargo check (desktop app)
        working-directory: .
        run: cargo check --locked -p otx-gng
