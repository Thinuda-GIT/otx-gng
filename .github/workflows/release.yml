name: Release

# Push a tag like v0.2.0 to build the installer and publish it with its SHA-256.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Build installer (also builds the Core sidecar in release mode)
        run: npm run tauri build
      - name: Checksums
        shell: pwsh
        working-directory: target/release/bundle/nsis
        run: |
          Get-ChildItem *.exe | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/SHA256SUMS.txt
          body: |
            OTX.GNG — Built and performed by Thinuda.

            This installer is not code-signed yet, so Windows SmartScreen will warn. Verify the
            SHA-256 below matches SHA256SUMS.txt before running it. Built by GitHub Actions from
            this tag's source.
